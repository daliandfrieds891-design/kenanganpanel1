<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KENANGAN — Cerita yang Tak Terlupakan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080a0f;
    color:#fff;
    min-height:100vh;
}

header{
    text-align:center;
    padding:55px 20px 35px;
    background:
        radial-gradient(circle at top,#29200b 0%,#080a0f 55%);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:8px;
    color:#f6c453;
}

.subtitle{
    margin-top:12px;
    color:#aaa;
    font-size:14px;
    letter-spacing:2px;
}

.line{
    width:80px;
    height:3px;
    background:#f6c453;
    margin:25px auto 0;
    border-radius:10px;
}

.container{
    width:min(1100px,92%);
    margin:40px auto 70px;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:50px 20px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#aaa;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#11151e;
    border:1px solid rgba(246,196,83,.18);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:rgba(246,196,83,.5);
}

.photo{
    width:100%;
    height:260px;
    object-fit:cover;
    display:block;
    background:#171b24;
}

.content{
    padding:22px;
}

.date{
    color:#f6c453;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:10px;
}

.title{
    font-size:22px;
    font-weight:800;
    margin-bottom:12px;
}

.story{
    color:#b8bcc5;
    font-size:14px;
    line-height:1.7;
    white-space:pre-line;
}

footer{
    text-align:center;
    padding:25px;
    color:#666;
    font-size:12px;
    border-top:1px solid #171b24;
}

.admin-link{
    display:inline-block;
    margin-top:12px;
    color:#777;
    text-decoration:none;
    font-size:11px;
}

.admin-link:hover{
    color:#f6c453;
}

@media(max-width:600px){
    .logo{
        font-size:30px;
        letter-spacing:5px;
    }

    header{
        padding:40px 15px 30px;
    }

    .container{
        width:94%;
        margin-top:25px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .photo{
        height:240px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">KENANGAN</div>
    <div class="subtitle">CERITA YANG TAK TERLUPAKAN</div>
    <div class="line"></div>
</header>

<main class="container">

    <div id="loading" class="loading">
        Memuat kenangan...
    </div>

    <div id="empty" class="empty" style="display:none;">
        Belum ada kenangan yang diposting.
    </div>

    <div id="gallery" class="grid"></div>

</main>

<footer>
    © 2026 KENANGAN — Semua cerita tetap tersimpan.
    <br>
    <a href="admin.html" class="admin-link">Admin</a>
</footer>

<script>

async function loadKenangan(){

    const loading = document.getElementById("loading");
    const empty = document.getElementById("empty");
    const gallery = document.getElementById("gallery");

    try{

        const { data, error } = await supabaseClient
            .from("kenangan")
            .select("*")
            .order("created_at", { ascending:false });

        if(error){
            throw error;
        }

        loading.style.display = "none";

        if(!data || data.length === 0){
            empty.style.display = "block";
            return;
        }

        gallery.innerHTML = "";

        data.forEach(item => {

            const card = document.createElement("article");
            card.className = "card";

            let tanggal = "";

            if(item.tanggal){
                const d = new Date(item.tanggal + "T00:00:00");

                tanggal = d.toLocaleDateString("id-ID", {
                    day:"2-digit",
                    month:"long",
                    year:"numeric"
                });
            }

            card.innerHTML = `
                <img
                    class="photo"
                    src="${escapeHtml(item.foto_url)}"
                    alt="${escapeHtml(item.judul || "Kenangan")}"
                    loading="lazy"
                >

                <div class="content">

                    ${tanggal ? `
                    <div class="date">
                        ${escapeHtml(tanggal)}
                    </div>
                    ` : ""}

                    <div class="title">
                        ${escapeHtml(item.judul || "Tanpa Judul")}
                    </div>

                    <div class="story">
                        ${escapeHtml(item.cerita || "")}
                    </div>

                </div>
            `;

            gallery.appendChild(card);

        });

    }catch(error){

        loading.style.display = "none";

        gallery.innerHTML = `
            <div class="empty" style="display:block;">
                Gagal memuat kenangan.<br><br>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;

        console.error(error);
    }
}


function escapeHtml(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


loadKenangan();

</script>

</body>
</html>
