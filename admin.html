<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenangan | PRAN MUSIC ENTAERTAIMENT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}


/* =====================================================
   LOGIN
===================================================== */

.login-page{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937,
            #374151
        );
}

.login-box{
    width:100%;
    max-width:420px;

    background:#fff;

    padding:35px;

    border-radius:20px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.3);
}

.logo{
    width:75px;
    height:75px;

    margin:0 auto 15px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #111827,
            #4b5563
        );

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;

    font-size:28px;
    font-weight:bold;
}

.login-box h1{
    text-align:center;

    font-size:23px;

    margin-bottom:7px;
}

.login-box p{
    text-align:center;

    color:#6b7280;

    font-size:14px;

    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    font-weight:bold;

    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;

    border:1px solid #d1d5db;

    padding:12px 14px;

    border-radius:10px;

    outline:none;

    font-size:14px;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#111827;
}

textarea{
    resize:vertical;

    min-height:110px;
}

.btn{
    border:none;

    padding:12px 17px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-login{
    width:100%;

    background:#111827;

    color:white;

    margin-top:5px;
}

.btn-login:hover{
    background:#000;
}

.error{
    color:#dc2626;

    background:#fee2e2;

    border-radius:8px;

    padding:10px;

    margin-bottom:15px;

    font-size:13px;

    display:none;
}


/* =====================================================
   ADMIN
===================================================== */

.admin-page{
    display:none;

    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:#111827;

    color:white;

    padding:16px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    position:sticky;

    top:0;

    z-index:50;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.15);
}

.header-left h2{
    font-size:19px;
}

.header-left span{
    font-size:12px;

    color:#d1d5db;
}

.header-right{
    display:flex;

    align-items:center;

    gap:10px;
}


/* =====================================================
   USER BADGE
===================================================== */

.user-badge{
    background:#374151;

    padding:8px 13px;

    border-radius:10px;

    font-size:13px;

    display:flex;

    align-items:center;

    gap:5px;

    border:1px solid
        rgba(255,255,255,.08);
}


/* MASTER BADGE */

.master-badge{
    background:
        linear-gradient(
            135deg,
            #7c5200,
            #d4af37,
            #8b6508
        );

    color:#fff;

    padding:8px 14px;

    border-radius:10px;

    font-size:13px;

    font-weight:bold;

    display:flex;

    align-items:center;

    gap:6px;

    box-shadow:
        0 3px 12px
        rgba(212,175,55,.35);

    border:1px solid
        rgba(255,255,255,.25);
}

.master-crown{
    font-size:17px;
}

.master-text{
    font-weight:bold;
}

.master-label{
    font-size:9px;

    background:
        rgba(0,0,0,.25);

    padding:3px 6px;

    border-radius:5px;

    letter-spacing:.5px;
}


.logout-btn{
    background:#dc2626;

    color:white;
}

.logout-btn:hover{
    background:#b91c1c;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1200px;

    margin:auto;

    padding:25px;
}


/* =====================================================
   CARD
===================================================== */

.card{
    background:white;

    border-radius:16px;

    padding:22px;

    margin-bottom:25px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.06);
}

.card-title{
    font-size:19px;

    font-weight:bold;

    margin-bottom:18px;
}


/* =====================================================
   UPLOAD
===================================================== */

.upload-area{
    border:2px dashed #9ca3af;

    padding:25px;

    text-align:center;

    border-radius:12px;

    background:#f9fafb;
}

.upload-area input{
    margin-top:12px;
}

.file-list{
    margin-top:12px;

    font-size:13px;

    color:#4b5563;

    line-height:1.7;
}

.progress{
    margin-top:15px;

    height:8px;

    background:#e5e7eb;

    border-radius:10px;

    overflow:hidden;

    display:none;
}

.progress-bar{
    width:0%;

    height:100%;

    background:#111827;

    transition:.2s;
}

.btn-upload{
    background:#111827;

    color:white;

    margin-top:15px;
}

.btn-upload:disabled{
    opacity:.5;

    cursor:not-allowed;
}


/* =====================================================
   HISTORY
===================================================== */

.history-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

    gap:10px;
}

.btn-refresh{
    background:#e5e7eb;

    color:#111827;
}

.memory-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px,1fr)
        );

    gap:18px;
}

.memory-card{
    border:1px solid #e5e7eb;

    border-radius:14px;

    overflow:hidden;

    background:white;
}

.memory-media{
    width:100%;

    height:210px;

    background:#111827;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;
}

.memory-media img,
.memory-media video{
    width:100%;

    height:100%;

    object-fit:cover;
}

.memory-content{
    padding:16px;
}

.memory-title{
    font-size:17px;

    font-weight:bold;

    margin-bottom:7px;
}

.memory-date{
    font-size:12px;

    color:#6b7280;

    margin-bottom:10px;
}

.memory-story{
    font-size:14px;

    line-height:1.5;

    color:#374151;

    white-space:pre-wrap;
}

.uploader{
    margin-top:12px;

    font-size:12px;

    color:#6b7280;
}

.actions{
    display:flex;

    gap:8px;

    margin-top:15px;
}

.btn-edit{
    background:#f59e0b;

    color:white;

    flex:1;
}

.btn-delete{
    background:#dc2626;

    color:white;

    flex:1;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.65);

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:100;
}

.modal-box{
    width:100%;

    max-width:500px;

    background:white;

    border-radius:18px;

    padding:25px;

    max-height:90vh;

    overflow-y:auto;
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.modal-header h3{
    font-size:19px;
}

.close-modal{
    border:none;

    background:#e5e7eb;

    width:34px;

    height:34px;

    border-radius:50%;

    cursor:pointer;

    font-size:18px;
}

.modal-actions{
    display:flex;

    gap:10px;

    margin-top:20px;
}

.btn-save{
    background:#111827;

    color:white;

    flex:1;
}

.btn-cancel{
    background:#e5e7eb;

    color:#111827;

    flex:1;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    text-align:center;

    padding:30px;

    color:#6b7280;
}

.empty{
    text-align:center;

    padding:40px;

    color:#6b7280;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .header{
        flex-direction:column;

        align-items:flex-start;
    }

    .header-right{
        width:100%;

        justify-content:space-between;
    }

    .container{
        padding:15px;
    }

    .memory-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div class="login-page" id="loginPage">

    <div class="login-box">

            PM
        </div>

        </h1>

    <header class="header">

<script>


/* =====================================================
   SUPABASE
===================================================== */

const {
    createClient
} = supabase;


/*
   config.js harus tersedia sebelum file HTML ini.

   Contoh config.js:

   const SUPABASE_URL =
       "URL_SUPABASE_KAMU";

   const SUPABASE_ANON_KEY =
       "ANON_KEY_SUPABASE_KAMU";
*/


const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =====================================================
   AKUN YANG DIIZINKAN
===================================================== */

const ALLOWED_USERNAMES = [

    "daligroupmaster",

    "pranmusicentertaiment"

];



/* =====================================================
   AKUN MASTER
===================================================== */

const CAN_MANAGE_POSTS =
    "daligroupmaster";



/* =====================================================
   VARIABLE
===================================================== */

let currentUsername = null;

let currentUserEmail = null;

let editingMemoryId = null;



/* =====================================================
   CEK MASTER
===================================================== */

function canManagePosts(){

    return (
        currentUsername ===
        CAN_MANAGE_POSTS
    );

}



/* =====================================================
   ELEMENT
===================================================== */

const loginPage =
    document.getElementById(
        "loginPage"
    );

const adminPage =
    document.getElementById(
        "adminPage"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const currentUserEl =
    document.getElementById(
        "currentUser"
    );

const userBadge =
    document.getElementById(
        "userBadge"
    );



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        loginError.style.display =
            "none";


        const username =
            document
            .getElementById(
                "username"
            )
            .value
            .trim()
            .toLowerCase();


        const password =
            document
            .getElementById(
                "password"
            )
            .value;



        if(
            !ALLOWED_USERNAMES
            .includes(username)
        ){

            showLoginError(
                "Username tidak terdaftar."
            );

            return;

        }



        try{


            /* CARI USERNAME */

            const {
                data,
                error
            } =
            await db
                .from(
                    "admin_login"
                )
                .select(
                    "username, login_email"
                )
                .eq(
                    "username",
                    username
                )
                .single();



            if(
                error ||
                !data
            ){

                showLoginError(
                    "Data username tidak ditemukan di database."
                );

                return;

            }



            /* LOGIN AUTH */

            const {
                data:authData,
                error:authError
            } =
            await db.auth
                .signInWithPassword({

                    email:
                        data.login_email,

                    password:
                        password

                });



            if(authError){

                showLoginError(
                    authError.message
                );

                return;

            }



            /* CEK ADMIN */

            const {
                data:adminCheck,
                error:adminError
            } =
            await db.rpc(
                "is_admin"
            );



            if(adminError){

                await db.auth
                    .signOut();

                showLoginError(
                    "Gagal memverifikasi akun admin."
                );

                return;

            }



            if(!adminCheck){

                await db.auth
                    .signOut();

                showLoginError(
                    "Akun ini bukan admin."
                );

                return;

            }



            currentUsername =
                data.username;


            currentUserEmail =
                data.login_email;



            showAdmin();



        }catch(err){

            console.error(err);

            showLoginError(
                "Terjadi kesalahan saat login."
            );

        }

    }
);



/* =====================================================
   ERROR LOGIN
===================================================== */

function showLoginError(message){

    loginError.textContent =
        message;

    loginError.style.display =
        "block";

}



/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

    loginPage.style.display =
        "none";


    adminPage.style.display =
        "block";



    /*
       MASTER:
       👑 daligroupmaster
       MASTER

       USER BIASA:
       👤 pranmusicentertaiment
    */

    if(
        currentUsername ===
        "daligroupmaster"
    ){

        userBadge.className =
            "master-badge";


        currentUserEl.innerHTML =
            `
            <span class="master-crown">
                👑
            </span>

            <span class="master-text">
                daligroupmaster
            </span>

            <span class="master-label">
                MASTER
            </span>
            `;

    }else{

        userBadge.className =
            "user-badge";


        currentUserEl.innerHTML =
            `
            👤 pranmusicentertaiment
            `;

    }



    loadMemories();

}



/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await db.auth
        .signOut();


    currentUsername =
        null;


    currentUserEmail =
        null;


    adminPage.style.display =
        "none";


    loginPage.style.display =
        "flex";


    document
        .getElementById(
            "password"
        )
        .value = "";

}



/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

    try{


        const {
            data
        } =
        await db.auth
            .getSession();



        if(
            !data.session
        ){

            return;

        }



        const email =
            data
            .session
            .user
            .email;



        const {
            data:userData,
            error
        } =
        await db
            .from(
                "admin_login"
            )
            .select(
                "username, login_email"
            )
            .eq(
                "login_email",
                email
            )
            .single();



        if(
            error ||
            !userData
        ){

            await db.auth
                .signOut();

            return;

        }



        if(
            !ALLOWED_USERNAMES
            .includes(
                userData.username
            )
        ){

            await db.auth
                .signOut();

            return;

        }



        currentUsername =
            userData.username;


        currentUserEmail =
            userData.login_email;



        showAdmin();



    }catch(err){

        console.error(err);

    }

}



/* =====================================================
   FILE SELECT
===================================================== */

document
    .getElementById(
        "mediaFiles"
    )
    .addEventListener(
        "change",
        function(){

            const files =
                this.files;


            const fileList =
                document.getElementById(
                    "fileList"
                );



            if(
                !files.length
            ){

                fileList.textContent =
                    "";

                return;

            }



            let html = "";



            for(
                let i=0;
                i<files.length;
                i++
            ){

                html +=
                    `${i+1}. ${escapeHtml(files[i].name)}<br>`;

            }



            fileList.innerHTML =
                html;

        }
    );



/* =====================================================
   UPLOAD
===================================================== */

async function uploadMemories(){

    const judul =
        document
        .getElementById(
            "judul"
        )
        .value
        .trim();


    const tanggal =
        document
        .getElementById(
            "tanggal"
        )
        .value;


    const cerita =
        document
        .getElementById(
            "cerita"
        )
        .value
        .trim();


    const files =
        document
        .getElementById(
            "mediaFiles"
        )
        .files;



    if(!judul){

        alert(
            "Judul wajib diisi."
        );

        return;

    }



    if(!tanggal){

        alert(
            "Tanggal wajib diisi."
        );

        return;

    }



    if(!files.length){

        alert(
            "Pilih minimal satu foto atau video."
        );

        return;

    }



    const uploadBtn =
        document.getElementById(
            "uploadBtn"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    const progressBar =
        document.getElementById(
            "progressBar"
        );



    uploadBtn.disabled =
        true;


    progress.style.display =
        "block";


    progressBar.style.width =
        "0%";



    try{


        for(
            let i=0;
            i<files.length;
            i++
        ){

            const file =
                files[i];



            const safeName =
                file.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );



            const filePath =
                `${Date.now()}_${i}_${safeName}`;



            /* STORAGE */

            const {
                error:uploadError
            } =
            await db.storage
                .from(
                    "kenangan"
                )
                .upload(
                    filePath,
                    file,
                    {
                        upsert:false
                    }
                );



            if(uploadError){

                throw uploadError;

            }



            /* PUBLIC URL */

            const {
                data:urlData
            } =
            db.storage
                .from(
                    "kenangan"
                )
                .getPublicUrl(
                    filePath
                );



            const mediaType =
                file.type
                .startsWith(
                    "video/"
                )
                ? "video"
                : "image";



            /* DATABASE */

            const {
                error:insertError
            } =
            await db
                .from(
                    "kenangan"
                )
                .insert({

                    judul:
                        judul,

                    cerita:
                        cerita,

                    tanggal:
                        tanggal,

                    foto_path:
                        filePath,

                    foto_url:
                        urlData.publicUrl,

                    media_type:
                        mediaType,

                    uploader_username:
                        currentUsername

                });



            if(insertError){

                await db.storage
                    .from(
                        "kenangan"
                    )
                    .remove([
                        filePath
                    ]);

                throw insertError;

            }



            const percent =
                Math.round(
                    (
                        (i + 1) /
                        files.length
                    ) * 100
                );


            progressBar.style.width =
                percent + "%";

        }



        alert(
            "✅ Semua postingan berhasil diupload."
        );



        document
            .getElementById(
                "judul"
            )
            .value = "";


        document
            .getElementById(
                "tanggal"
            )
            .value = "";


        document
            .getElementById(
                "cerita"
            )
            .value = "";


        document
            .getElementById(
                "mediaFiles"
            )
            .value = "";


        document
            .getElementById(
                "fileList"
            )
            .innerHTML = "";



        await loadMemories();



    }catch(error){

        console.error(error);

        alert(
            "❌ Upload gagal: " +
            error.message
        );

    }finally{

        uploadBtn.disabled =
            false;


        setTimeout(
            function(){

                progress.style.display =
                    "none";


                progressBar.style.width =
                    "0%";

            },
            1000
        );

    }

}



/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadMemories(){

    const container =
        document.getElementById(
            "memoryContainer"
        );


    container.innerHTML =
        `
        <div class="loading">
            Memuat data...
        </div>
        `;



    try{


        const {
            data,
            error
        } =
        await db
            .from(
                "kenangan"
            )
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );



        if(error){

            throw error;

        }



        if(
            !data ||
            !data.length
        ){

            container.innerHTML =
                `
                <div class="empty">
                    Belum ada kenangan.
                </div>
                `;

            return;

        }



        container.innerHTML =
            "";



        data.forEach(
            function(memory){


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "memory-card";



                /* MEDIA */

                let mediaHTML = "";



                if(
                    memory.media_type ===
                    "video"
                ){

                    mediaHTML =
                    `
                    <div class="memory-media">

                        <video
                            src="${escapeHtml(memory.foto_url)}"
                            controls>
                        </video>

                    </div>
                    `;

                }else{

                    mediaHTML =
                    `
                    <div class="memory-media">

                        <img
                            src="${escapeHtml(memory.foto_url)}"
                            alt="Kenangan"
                            loading="lazy">

                    </div>
                    `;

                }



                /* ACTION */

                let actionHTML =
                    "";



                /*
                   HANYA MASTER
                   yang mendapatkan
                   tombol EDIT + HAPUS
                */

                if(
                    canManagePosts()
                ){

                    actionHTML =
                    `
                    <div class="actions">

                        <button
                            class="btn btn-edit"
                            onclick="openEditMemory('${escapeHtml(memory.id)}')">

                            ✏️ EDIT

                        </button>


                        <button
                            class="btn btn-delete"
                            onclick="deleteMemory('${escapeHtml(memory.id)}')">

                            🗑️ HAPUS

                        </button>

                    </div>
                    `;

                }



                card.innerHTML =
                `
                ${mediaHTML}

                <div class="memory-content">


                    <div class="memory-title">

                        ${escapeHtml(
                            memory.judul || ""
                        )}

                    </div>


                    <div class="memory-date">

                        📅
                        ${formatDate(
                            memory.tanggal
                        )}

                    </div>


                    <div class="memory-story">

                        ${escapeHtml(
                            memory.cerita || ""
                        )}

                    </div>


                    <div class="uploader">

                        👤 Upload oleh:

                        <strong>
                            ${escapeHtml(
                                memory.uploader_username || "-"
                            )}
                        </strong>

                    </div>


                    ${actionHTML}


                </div>
                `;



                container.appendChild(
                    card
                );

            }
        );



    }catch(error){

        console.error(error);


        container.innerHTML =
        `
        <div class="empty">

            Gagal memuat history.

            <br>

            ${escapeHtml(
                error.message
            )}

        </div>
        `;

    }

}

async function saveEditMemory(){


    if(
        !canManagePosts()
    ){

        alert(
            "❌ Anda tidak memiliki izin untuk edit."
        );

        return;

    }



    if(!editingMemoryId){

        return;

    }



    const judul =
        document
        .getElementById(
            "editJudul"
        )
        .value
        .trim();


    const tanggal =
        document
        .getElementById(
            "editTanggal"
        )
        .value;


    const cerita =
        document
        .getElementById(
            "editCerita"
        )
        .value
        .trim();



    if(!judul){

        alert(
            "Judul wajib diisi."
        );

        return;

    }



    if(!tanggal){

        alert(
            "Tanggal wajib diisi."
        );

        return;

    }



    try{


        const {
            error
        } =
        await db
            .from(
                "kenangan"
            )
            .update({

                judul:
                    judul,

                tanggal:
                    tanggal,

                cerita:
                    cerita

            })
            .eq(
                "id",

            );



        if(error){

            throw error;

        }



        alert(
            "✅ Postingan berhasil diperbarui."
        );



        closeEditModal();


        await loadMemories();



    }catch(error){

        console.error(error);


        alert(
            "❌ Gagal menyimpan perubahan: " +
            error.message
        );

    }

}

/* =====================================================
   DELETE
===================================================== */

async function deleteMemory(id){


    if(
        !canManagePosts()
    ){

        alert(
            "❌ Anda tidak memiliki izin untuk menghapus."
        );

        return;

    }



    const yakin =
        confirm(
            "Yakin ingin menghapus postingan ini?"
        );



    if(!yakin){

        return;

    }



    try{


        /* AMBIL FOTO PATH */

        const {
            data,
            error
        } =
        await db
            .from(
                "kenangan"
            )
            .select(
                "foto_path"
            )
            .eq(
                "id",
                id
            )
            .single();



        if(error){

            throw error;

        }



        /* HAPUS STORAGE */

        if(
            data &&
            data.foto_path
        ){

            const {
                error:storageError
            } =
            await db.storage
                .from(
                    "kenangan"
                )
                .remove([
                    data.foto_path
                ]);



            if(storageError){

                console.warn(
                    "Storage delete error:",
                    storageError
                );

            }

        }



        /* HAPUS DATABASE */

        const {
            error:deleteError
        } =
        await db
            .from(
                "kenangan"
            )
            .delete()
            .eq(
                "id",
                id
            );



        if(deleteError){

            throw deleteError;

        }



        alert(
            "✅ Postingan berhasil dihapus."
        );



        await loadMemories();



    }catch(error){

        console.error(error);


        alert(
            "❌ Gagal menghapus: " +
            error.message
        );

    }

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    if(!date){

        return "-";

    }



    const d =
        new Date(
            date +
            "T00:00:00"
        );



    if(
        isNaN(
            d.getTime()
        )
    ){

        return date;

    }



    return d.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",

            month:"long",

            year:"numeric"
        }
    );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }



    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
