<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenangan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080a0f;
    color:#fff;
    min-height:100vh;
}

header{
    padding:20px;
    border-bottom:1px solid rgba(246,196,83,.2);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#f6c453;
}

.logout{
    border:1px solid #f6c453;
    background:transparent;
    color:#f6c453;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#121722;
    border:1px solid rgba(246,196,83,.15);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#999;
    margin-bottom:30px;
}

label{
    display:block;
    margin:18px 0 8px;
    color:#ddd;
}

input,
textarea{
    width:100%;
    background:#080a0f;
    color:#fff;
    border:1px solid #303746;
    border-radius:10px;
    padding:14px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#f6c453;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input[type="file"]{
    padding:12px;
}

.preview{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:12px;
    margin-top:15px;
}

.preview img{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #333;
}

.post{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#f6c453,#d99d2b);
    color:#080a0f;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.post:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    display:none;
}

.success{
    display:block;
    background:rgba(46,204,113,.12);
    color:#6cff9b;
    border:1px solid rgba(46,204,113,.3);
}

.error{
    display:block;
    background:rgba(231,76,60,.12);
    color:#ff8f85;
    border:1px solid rgba(231,76,60,.3);
}

#loginPanel{
    max-width:450px;
    margin:100px auto;
    padding:20px;
}

.login-card{
    background:#121722;
    padding:30px;
    border-radius:20px;
    border:1px solid rgba(246,196,83,.15);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.login-card h1{
    text-align:center;
    margin-bottom:25px;
}

.login-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#f6c453;
    color:#080a0f;
    font-weight:bold;
    cursor:pointer;
}

#adminPanel{
    display:none;
}

@media(max-width:600px){

    .container{
        margin:20px auto;
        padding:12px;
    }

    .card{
        padding:20px;
    }

    header{
        padding:16px;
    }

    .logo{
        font-size:17px;
    }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN ADMIN
========================= -->

<div id="loginPanel">

    <div class="login-card">

        <h1>
            ADMIN
            <span style="color:#f6c453;">
                KENANGAN
            </span>
        </h1>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Email admin"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password admin"
        >

        <button
            class="login-btn"
            id="loginBtn"
        >
            LOGIN
        </button>

        <div
            id="loginStatus"
            class="status"
        ></div>

    </div>

</div>


<!-- =========================
     PANEL ADMIN
========================= -->

<div id="adminPanel">

<header>

    <div class="logo">
        KENANGAN <span>ADMIN</span>
    </div>

    <button
        class="logout"
        id="logoutBtn"
    >
        LOGOUT
    </button>

</header>


<div class="container">

<div class="card">

    <h1>Tambah Kenangan</h1>

    <p class="subtitle">
        Upload foto dan simpan cerita kenangan.
    </p>


    <label>Pilih Foto</label>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
    >

    <div
        id="previewGrid"
        class="preview"
    ></div>


    <label>Judul Kenangan</label>

    <input
        type="text"
        id="judul"
        placeholder="Contoh: Kenangan Bersama"
    >


    <label>Tanggal</label>

    <input
        type="date"
        id="tanggal"
    >


    <label>Cerita</label>

    <textarea
        id="cerita"
        placeholder="Tulis cerita kenangan..."
    ></textarea>


    <button
        class="post"
        id="postBtn"
    >
        POSTING KENANGAN
    </button>


    <div
        id="status"
        class="status"
    ></div>

</div>

</div>

</div>


<script>

/* =========================
   ELEMENT
========================= */

const photoInput =
    document.getElementById("photoInput");

const previewGrid =
    document.getElementById("previewGrid");

const postBtn =
    document.getElementById("postBtn");

let selectedPhotos = [];


/* =========================
   PREVIEW FOTO
========================= */

photoInput.addEventListener(
    "change",
    function(){

        selectedPhotos =
            Array.from(this.files);

        previewGrid.innerHTML = "";

        selectedPhotos.forEach(file => {

            const reader =
                new FileReader();

            reader.onload =
                function(event){

                    const img =
                        document.createElement("img");

                    img.src =
                        event.target.result;

                    previewGrid.appendChild(img);

                };

            reader.readAsDataURL(file);

        });

    }
);


/* =========================
   STATUS LOGIN
========================= */

function showLoginStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "loginStatus"
        );

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================
   STATUS POSTING
========================= */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================
   LOGIN
========================= */

document
.getElementById("loginBtn")
.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        if(!email || !password){

            showLoginStatus(
                "Email dan password wajib diisi.",
                "error"
            );

            return;

        }


        showLoginStatus(
            "Sedang login...",
            "success"
        );


        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            showLoginStatus(
                error.message,
                "error"
            );

            return;

        }


        const {
            data:isAdmin,
            error:adminError
        } =
        await supabaseClient
        .rpc("is_admin");


        if(
            adminError ||
            !isAdmin
        ){

            await supabaseClient
            .auth
            .signOut();

            showLoginStatus(
                "Akun ini bukan admin.",
                "error"
            );

            return;

        }


        document
        .getElementById("loginPanel")
        .style
        .display = "none";


        document
        .getElementById("adminPanel")
        .style
        .display = "block";

    }
);


/* =========================
   CEK SESSION
========================= */

async function checkAdmin(){

    const {
        data:{
            session
        }
    } =
    await supabaseClient
    .auth
    .getSession();


    if(!session){

        document
        .getElementById("loginPanel")
        .style
        .display = "block";

        document
        .getElementById("adminPanel")
        .style
        .display = "none";

        return;

    }


    const {
        data:isAdmin,
        error
    } =
    await supabaseClient
    .rpc("is_admin");


    if(
        error ||
        !isAdmin
    ){

        await supabaseClient
        .auth
        .signOut();

        return;

    }


    document
    .getElementById("loginPanel")
    .style
    .display = "none";


    document
    .getElementById("adminPanel")
    .style
    .display = "block";

}


checkAdmin();


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async function(){

        await supabaseClient
        .auth
        .signOut();

        location.reload();

    }
);


/* =========================
   POSTING KENANGAN
========================= */

postBtn.addEventListener(
    "click",
    async function(){

        const judul =
            document
            .getElementById("judul")
            .value
            .trim();

        const tanggal =
            document
            .getElementById("tanggal")
            .value;

        const cerita =
            document
            .getElementById("cerita")
            .value
            .trim();


        if(selectedPhotos.length === 0){

            showStatus(
                "Silakan pilih foto terlebih dahulu.",
                "error"
            );

            return;

        }


        if(!judul){

            showStatus(
                "Judul kenangan wajib diisi.",
                "error"
            );

            return;

        }


        postBtn.disabled = true;


        showStatus(
            "Sedang mengupload...",
            "success"
        );


        try{

            for(
                let i = 0;
                i < selectedPhotos.length;
                i++
            ){

                const file =
                    selectedPhotos[i];


                const extension =
                    file.name
                    .split(".")
                    .pop();


                const fileName =
                    Date.now()
                    + "-"
                    + Math.random()
                    .toString(36)
                    .substring(2)
                    + "."
                    + extension;


                const filePath =
                    fileName;


                /* =========================
                   UPLOAD STORAGE
                ========================= */

                const {
                    error:uploadError
                } =
                await supabaseClient
                .storage
                .from("kenangan")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


                if(uploadError){

                    throw uploadError;

                }


                /* =========================
                   PUBLIC URL
                ========================= */

                const {
                    data:publicData
                } =
                supabaseClient
                .storage
                .from("kenangan")
                .getPublicUrl(
                    filePath
                );


                const fotoUrl =
                    publicData.publicUrl;


                /* =========================
                   INSERT DATABASE
                ========================= */

                const {
                    error:databaseError
                } =
                await supabaseClient
                .from("kenangan")
                .insert({

                    judul:judul,

                    cerita:cerita,

                    tanggal:
                        tanggal || null,

                    foto_path:
                        filePath,

                    foto_url:
                        fotoUrl

                });


                if(databaseError){

                    throw databaseError;

                }

            }


            showStatus(
                "✓ KENANGAN BERHASIL DIPOSTING!",
                "success"
            );


            photoInput.value = "";

            selectedPhotos = [];

            previewGrid.innerHTML = "";

            document
            .getElementById("judul")
            .value = "";

            document
            .getElementById("tanggal")
            .value = "";

            document
            .getElementById("cerita")
            .value = "";


        }
        catch(error){

            console.error(error);

            showStatus(
                "Gagal: " + error.message,
                "error"
            );

        }
        finally{

            postBtn.disabled = false;

        }

    }
);

</script>

</body>
</html>
