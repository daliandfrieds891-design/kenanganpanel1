<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenangan | PRAN MUSIC ENTAERTAIMENT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080a0f;
    color:#fff;
    min-height:100vh;
}

header{
    padding:20px;
    border-bottom:1px solid rgba(246,196,83,.2);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#f6c453;
}

.logout{
    border:1px solid #f6c453;
    background:transparent;
    color:#f6c453;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.logout:hover{
    background:#f6c453;
    color:#080a0f;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#121722;
    border:1px solid rgba(246,196,83,.15);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
    margin-bottom:10px;
}

h2{
    margin-bottom:10px;
}

.subtitle{
    color:#aaa;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #303744;
    background:#080a0f;
    color:#fff;
    outline:none;
    margin-bottom:18px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#f6c453;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.login-btn,
.post-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#f6c453;
    color:#080a0f;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover,
.post-btn:hover{
    background:#ffd978;
}

.login-btn:disabled,
.post-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:rgba(255,70,70,.1);
    border:1px solid rgba(255,70,70,.3);
    color:#ff8585;
    display:none;
}

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:430px;
}

.login-logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:10px;
}

.login-logo span{
    color:#f6c453;
}

.login-subtitle{
    text-align:center;
    color:#999;
    margin-bottom:30px;
}

#adminPage{
    display:none;
}

.admin-info{
    margin-bottom:25px;
    padding:15px;
    border-radius:12px;
    background:#0c1018;
    border:1px solid rgba(246,196,83,.1);
}

.admin-info strong{
    color:#f6c453;
}

.media-preview-title{
    margin:15px 0 10px;
    color:#f6c453;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.preview-item{
    background:#080a0f;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #252b35;
}

.preview-item img,
.preview-item video{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
}

.file-info{
    color:#aaa;
    font-size:14px;
    margin-top:-8px;
    margin-bottom:20px;
}

.status{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    line-height:1.5;
}

.status.success{
    display:block;
    background:rgba(60,200,120,.1);
    border:1px solid rgba(60,200,120,.3);
    color:#72e0a2;
}

.status.error{
    display:block;
    background:rgba(255,70,70,.1);
    border:1px solid rgba(255,70,70,.3);
    color:#ff8585;
}

/* HISTORY */

.history-section{
    margin-top:30px;
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.history-header h2{
    color:#fff;
}

.refresh-btn{
    border:1px solid #f6c453;
    background:transparent;
    color:#f6c453;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#f6c453;
    color:#080a0f;
}

.history-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.history-item{
    background:#080a0f;
    border:1px solid #292f3a;
    border-radius:16px;
    overflow:hidden;
}

.history-media{
    width:100%;
    height:210px;
    background:#05070a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.history-media img,
.history-media video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.history-content{
    padding:16px;
}

.history-title{
    color:#f6c453;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.history-date{
    color:#888;
    font-size:13px;
    margin-bottom:10px;
}

.history-story{
    color:#bbb;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.media-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:rgba(246,196,83,.1);
    color:#f6c453;
    font-size:11px;
    font-weight:bold;
    margin-bottom:12px;
}

.delete-btn{
    width:100%;
    padding:11px;
    border:1px solid #ff5555;
    background:rgba(255,70,70,.08);
    color:#ff7777;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.delete-btn:hover{
    background:#ff5555;
    color:#fff;
}

.empty-history{
    grid-column:1/-1;
    text-align:center;
    padding:40px 20px;
    border:1px dashed #343b47;
    border-radius:15px;
    color:#888;
}

.loading-history{
    grid-column:1/-1;
    text-align:center;
    padding:30px;
    color:#aaa;
}

/* HILANGKAN LINK / TEKS URL */
.history-item a{
    display:none !important;
}

@media(max-width:600px){

    header{
        padding:15px;
    }

    .logo{
        font-size:17px;
    }

    .logout{
        padding:8px 12px;
        font-size:13px;
    }

    .container{
        margin:20px auto;
        padding:15px;
    }

    .card{
        padding:20px;
    }

    h1{
        font-size:24px;
    }

    .history-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .refresh-btn{
        width:100%;
    }

    .history-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<section id="loginPage">

<div class="card login-card">

    <div class="login-logo">
        PRAN <span>MUSIC</span>
    </div>

    <div class="login-subtitle">
        ADMIN KENANGAN
    </div>

    <label for="username">Username</label>

    <input
        type="text"
        id="username"
        placeholder="Masukkan username"
        autocomplete="username"
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
    >

    <button class="login-btn" id="loginBtn">
        LOGIN
    </button>

    <div id="loginError" class="error"></div>

</div>

</section>


<section id="adminPage">

<header>

<div class="logo">
    PRAN <span>MUSIC</span>
</div>

<button class="logout" id="logoutBtn">
    LOGOUT
</button>

</header>


<div class="container">

<div class="card">

<h1>Upload Kenangan</h1>

<p class="subtitle">
    Tambahkan foto atau video kenangan PRAN MUSIC ENTAERTAIMENT.
</p>


<div class="admin-info">
    Login sebagai:
    <strong id="loggedUsername">Admin</strong>
</div>


<label for="mediaType">
    Jenis Media
</label>

<select id="mediaType">

<option value="foto">
    Foto
</option>

<option value="video">
    Video
</option>

</select>


<label for="mediaInput">
    Pilih Foto / Video
</label>

<input
    type="file"
    id="mediaInput"
    multiple
    accept="image/*"
>

<div class="file-info" id="fileInfo">
    Belum ada file dipilih
</div>


<h3
    class="media-preview-title"
    id="previewTitle"
    style="display:none;"
>
    Preview Media
</h3>

<div
    class="preview-grid"
    id="previewGrid"
></div>


<label for="judul">
    Judul Kenangan
</label>

<input
    type="text"
    id="judul"
    placeholder="Contoh: Acara Pernikahan"
>


<label for="tanggal">
    Tanggal
</label>

<input
    type="date"
    id="tanggal"
>


<label for="cerita">
    Cerita / Keterangan
</label>

<textarea
    id="cerita"
    placeholder="Tulis cerita atau keterangan kenangan..."
></textarea>


<button class="post-btn" id="postBtn">
    POST KENANGAN
</button>

<div id="status" class="status"></div>


<!-- HISTORY -->

<div class="history-section">

<div class="history-header">

    <h2>
        History Upload
    </h2>

    <button
        class="refresh-btn"
        id="refreshHistoryBtn"
    >
        ↻ REFRESH
    </button>

</div>


<div
    class="history-grid"
    id="historyGrid"
>
    <div class="loading-history">
        Memuat history...
    </div>
</div>

</div>

</div>

</div>

</section>


<script>

const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const loggedUsername =
    document.getElementById("loggedUsername");

const mediaType =
    document.getElementById("mediaType");

const mediaInput =
    document.getElementById("mediaInput");

const fileInfo =
    document.getElementById("fileInfo");

const previewGrid =
    document.getElementById("previewGrid");

const previewTitle =
    document.getElementById("previewTitle");

const postBtn =
    document.getElementById("postBtn");

const statusBox =
    document.getElementById("status");

const historyGrid =
    document.getElementById("historyGrid");

const refreshHistoryBtn =
    document.getElementById("refreshHistoryBtn");


let selectedMedia = [];


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    login
);


passwordInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            login();
        }

    }
);


async function login(){

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    loginError.style.display = "none";


    if(!username || !password){

        showLoginError(
            "Username dan password wajib diisi."
        );

        return;

    }


    loginBtn.disabled = true;
    loginBtn.textContent = "MEMERIKSA...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("admin_login")
            .select(
                "username, login_email"
            )
            .eq(
                "username",
                username
            )
            .maybeSingle();


        if(error){
            throw error;
        }


        if(!data){

            throw new Error(
                "Username tidak ditemukan."
            );

        }


        const {
            error:authError
        } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:data.login_email,
                password:password

            });


        if(authError){
            throw authError;
        }


        const {
            data:isAdmin,
            error:adminError
        } =
        await supabaseClient
            .rpc("is_admin");


        if(adminError){

            await supabaseClient
                .auth
                .signOut();

            throw adminError;

        }


        if(!isAdmin){

            await supabaseClient
                .auth
                .signOut();

            throw new Error(
                "Akun ini belum terdaftar sebagai admin."
            );

        }


        loggedUsername.textContent =
            data.username;


        loginPage.style.display =
            "none";

        adminPage.style.display =
            "block";


        await loadHistory();

    }
    catch(error){

        console.error(error);

        showLoginError(
            "Login gagal: " +
            error.message
        );

    }
    finally{

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";

    }

}


function showLoginError(message){

    loginError.textContent =
        message;

    loginError.style.display =
        "block";

}


/* =========================
   SESSION
========================= */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient
        .auth
        .getSession();


    if(data.session){

        const {
            data:isAdmin
        } =
        await supabaseClient
            .rpc("is_admin");


        if(isAdmin){

            const email =
                data.session.user.email;


            const {
                data:userData
            } =
            await supabaseClient
                .from("admin_login")
                .select("username")
                .eq(
                    "login_email",
                    email
                )
                .maybeSingle();


            loggedUsername.textContent =
                userData?.username ||
                "Admin";


            loginPage.style.display =
                "none";

            adminPage.style.display =
                "block";


            await loadHistory();

        }
        else{

            await supabaseClient
                .auth
                .signOut();

        }

    }

}


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient
            .auth
            .signOut();


        adminPage.style.display =
            "none";

        loginPage.style.display =
            "flex";


        usernameInput.value = "";
        passwordInput.value = "";

        historyGrid.innerHTML = "";

    }
);


/* =========================
   MEDIA TYPE
========================= */

mediaType.addEventListener(
    "change",
    function(){

        if(
            mediaType.value ===
            "video"
        ){

            mediaInput.accept =
                "video/*";

        }
        else{

            mediaInput.accept =
                "image/*";

        }


        mediaInput.value = "";

        selectedMedia = [];

        previewGrid.innerHTML = "";

        previewTitle.style.display =
            "none";

        fileInfo.textContent =
            "Belum ada file dipilih";

    }
);


/* =========================
   SELECT MEDIA
========================= */

mediaInput.addEventListener(
    "change",
    function(){

        selectedMedia =
            Array.from(
                mediaInput.files
            );


        if(
            selectedMedia.length === 0
        ){

            fileInfo.textContent =
                "Belum ada file dipilih";

            return;

        }


        fileInfo.textContent =
            selectedMedia.length +
            " file dipilih";


        previewGrid.innerHTML = "";

        previewTitle.style.display =
            "block";


        selectedMedia.forEach(
            function(file){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "preview-item";


                const url =
                    URL.createObjectURL(
                        file
                    );


                if(
                    file.type.startsWith(
                        "video/"
                    )
                ){

                    const video =
                        document.createElement(
                            "video"
                        );

                    video.src = url;

                    video.controls = true;

                    item.appendChild(video);

                }
                else{

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src = url;

                    item.appendChild(img);

                }


                previewGrid.appendChild(
                    item
                );

            }
        );

    }
);


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;

}


/* =========================
   UPLOAD
========================= */

postBtn.addEventListener(
    "click",
    async function(){

        if(
            selectedMedia.length === 0
        ){

            showStatus(
                "Pilih foto atau video terlebih dahulu.",
                "error"
            );

            return;

        }


        const judul =
            document
                .getElementById("judul")
                .value
                .trim();


        const tanggal =
            document
                .getElementById("tanggal")
                .value;


        const cerita =
            document
                .getElementById("cerita")
                .value
                .trim();


        if(!judul){

            showStatus(
                "Judul kenangan wajib diisi.",
                "error"
            );

            return;

        }


        postBtn.disabled = true;

        postBtn.textContent =
            "MENGUPLOAD...";


        try{

            for(
                const file of selectedMedia
            ){

                const safeName =
                    file.name.replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


                const filePath =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2,8) +
                    "_" +
                    safeName;


                const {
                    error:uploadError
                } =
                await supabaseClient
                    .storage
                    .from("kenangan")
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false
                        }
                    );


                if(uploadError){
                    throw uploadError;
                }


                const {
                    data:urlData
                } =
                supabaseClient
                    .storage
                    .from("kenangan")
                    .getPublicUrl(
                        filePath
                    );


                const mediaUrl =
                    urlData.publicUrl;


                const {
                    error:databaseError
                } =
                await supabaseClient
                    .from("kenangan")
                    .insert({

                        judul:judul,

                        cerita:cerita,

                        tanggal:
                            tanggal || null,

                        foto_path:
                            filePath,

                        foto_url:
                            mediaUrl,

                        media_type:
                            file.type.startsWith(
                                "video/"
                            )
                            ? "video"
                            : "foto"

                    });


                if(databaseError){
                    throw databaseError;
                }

            }


            showStatus(
                "✓ " +
                selectedMedia.length +
                " MEDIA BERHASIL DIPOSTING!",
                "success"
            );


            mediaInput.value = "";

            selectedMedia = [];

            previewGrid.innerHTML = "";

            previewTitle.style.display =
                "none";

            fileInfo.textContent =
                "Belum ada file dipilih";


            document
                .getElementById("judul")
                .value = "";

            document
                .getElementById("tanggal")
                .value = "";

            document
                .getElementById("cerita")
                .value = "";


            await loadHistory();

        }
        catch(error){

            console.error(error);

            showStatus(
                "Gagal upload: " +
                error.message,
                "error"
            );

        }
        finally{

            postBtn.disabled = false;

            postBtn.textContent =
                "POST KENANGAN";

        }

    }
);


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

    historyGrid.innerHTML =
        `
        <div class="loading-history">
            Memuat history...
        </div>
        `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("kenangan")
            .select(
                "*"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){
            throw error;
        }


        if(
            !data ||
            data.length === 0
        ){

            historyGrid.innerHTML =
                `
                <div class="empty-history">
                    Belum ada foto atau video yang diupload.
                </div>
                `;

            return;

        }


        historyGrid.innerHTML =
            "";


        data.forEach(
            function(item){

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "history-item";


                /*
                 * URL tetap dipakai sebagai
                 * sumber media, tetapi tidak
                 * pernah dibuat sebagai teks/link.
                 */

                let media;


                if(
                    item.media_type ===
                    "video"
                ){

                    const video =
                        document.createElement(
                            "video"
                        );

                    video.src =
                        item.foto_url;

                    video.controls =
                        true;

                    video.preload =
                        "metadata";

                    video.playsInline =
                        true;

                    media =
                        video;

                }
                else{

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        item.foto_url;

                    img.alt =
                        item.judul ||
                        "Foto Kenangan";

                    media =
                        img;

                }


                const mediaBox =
                    document.createElement(
                        "div"
                    );

                mediaBox.className =
                    "history-media";


                mediaBox.appendChild(
                    media
                );


                const content =
                    document.createElement(
                        "div"
                    );

                content.className =
                    "history-content";


                const badge =
                    document.createElement(
                        "div"
                    );

                badge.className =
                    "media-badge";

                badge.textContent =
                    item.media_type ===
                    "video"
                    ? "VIDEO"
                    : "FOTO";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "history-title";

                title.textContent =
                    item.judul ||
                    "Tanpa Judul";


                const date =
                    document.createElement(
                        "div"
                    );

                date.className =
                    "history-date";

                date.textContent =
                    item.tanggal
                    ? formatDate(
                        item.tanggal
                    )
                    : "Tanggal tidak diisi";


                const story =
                    document.createElement(
                        "div"
                    );

                story.className =
                    "history-story";

                story.textContent =
                    item.cerita ||
                    "Tidak ada keterangan.";


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-btn";

                deleteButton.textContent =
                    "🗑 HAPUS MEDIA";


                deleteButton.addEventListener(
                    "click",
                    function(){

                        deleteMemory(
                            item.id
                        );

                    }
                );


                content.appendChild(
                    badge
                );

                content.appendChild(
                    title
                );

                content.appendChild(
                    date
                );

                content.appendChild(
                    story
                );

                content.appendChild(
                    deleteButton
                );


                card.appendChild(
                    mediaBox
                );

                card.appendChild(
                    content
                );


                historyGrid.appendChild(
                    card
                );

            }
        );

    }
    catch(error){

        console.error(error);

        historyGrid.innerHTML =
            `
            <div class="empty-history">
                Gagal memuat history.<br>
                ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =========================
   DELETE MEMORY
========================= */

async function deleteMemory(id){

    const confirmed =
        confirm(
            "Yakin ingin menghapus foto/video ini?\n\n" +
            "File akan dihapus dari history dan Storage."
        );


    if(!confirmed){
        return;
    }


    try{

        const {
            data:item,
            error:findError
        } =
        await supabaseClient
            .from("kenangan")
            .select(
                "id, foto_path, media_type, judul"
            )
            .eq(
                "id",
                id
            )
            .maybeSingle();


        if(findError){
            throw findError;
        }


        if(!item){

            alert(
                "Data tidak ditemukan."
            );

            return;

        }


        if(item.foto_path){

            const {
                error:storageError
            } =
            await supabaseClient
                .storage
                .from("kenangan")
                .remove([
                    item.foto_path
                ]);


            if(storageError){
                throw storageError;
            }

        }


        const {
            error:deleteError
        } =
        await supabaseClient
            .from("kenangan")
            .delete()
            .eq(
                "id",
                id
            );


        if(deleteError){
            throw deleteError;
        }


        showStatus(
            "✓ " +
            (
                item.media_type ===
                "video"
                ? "Video"
                : "Foto"
            ) +
            " berhasil dihapus.",
            "success"
        );


        await loadHistory();

    }
    catch(error){

        console.error(error);

        showStatus(
            "Gagal menghapus: " +
            error.message,
            "error"
        );

    }

}

/* =========================
   HELPER
========================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function formatDate(dateString){

    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}
