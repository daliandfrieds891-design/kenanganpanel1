<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenangan | PRAN MUSIC ENTAERTAIMENT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080a0f;
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#1b1d24 0%,#080a0f 55%);
}

.login-box{
    width:100%;
    max-width:430px;
    background:#11151d;
    border:1px solid rgba(246,196,83,.25);
    border-radius:24px;
    padding:35px 28px;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-main{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    color:#f6c453;
}

.logo-sub{
    margin-top:7px;
    font-size:12px;
    color:#9ca3af;
    letter-spacing:2px;
}

.login-title{
    text-align:center;
    font-size:22px;
    margin-bottom:24px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    color:#d1d5db;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #292e38;
    background:#0b0e14;
    color:#fff;
    border-radius:12px;
    padding:13px 14px;
    outline:none;
    transition:.2s;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#f6c453;
    box-shadow:0 0 0 3px rgba(246,196,83,.08);
}

.login-btn,
.post-btn{
    width:100%;
    border:none;
    border-radius:12px;
    padding:14px;
    background:linear-gradient(135deg,#f6c453,#d99d2b);
    color:#111;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover,
.post-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.login-btn:disabled,
.post-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login-error{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
    font-size:13px;
    line-height:1.5;
}

/* =========================
   ADMIN
========================= */

#adminPage{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(8,10,15,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #242832;
    padding:15px 22px;
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-title{
    color:#f6c453;
    font-weight:900;
    letter-spacing:1px;
}

.brand-sub{
    color:#777f8c;
    font-size:11px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-badge{
    padding:8px 12px;
    border-radius:999px;
    background:rgba(246,196,83,.08);
    border:1px solid rgba(246,196,83,.22);
    color:#f6c453;
    font-size:12px;
    font-weight:700;
}

.logout-btn{
    border:1px solid #343a45;
    background:#11151d;
    color:#fff;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
}

.logout-btn:hover{
    border-color:#f6c453;
    color:#f6c453;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:30px 20px 60px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:7px;
}

.page-title p{
    color:#858d9a;
    font-size:14px;
}

/* =========================
   UPLOAD CARD
========================= */

.panel{
    background:#11151d;
    border:1px solid #242832;
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.panel-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
    color:#f6c453;
}

.media-type{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}

.media-type button{
    border:1px solid #303641;
    background:#0b0e14;
    color:#b8bec8;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    font-weight:800;
}

.media-type button.active{
    border-color:#f6c453;
    background:rgba(246,196,83,.09);
    color:#f6c453;
}

.file-box{
    border:1px dashed #3b414d;
    background:#0b0e14;
    border-radius:15px;
    padding:22px;
    text-align:center;
    margin-bottom:20px;
}

.file-box input{
    width:100%;
    color:#aaa;
}

.selected-files{
    margin-top:12px;
    text-align:left;
    color:#9ca3af;
    font-size:12px;
    line-height:1.7;
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    margin-bottom:18px;
    padding:13px 15px;
    border-radius:11px;
    font-size:13px;
    line-height:1.5;
}

.status.success{
    display:block;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.3);
    color:#86efac;
}

.status.error{
    display:block;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
}

.status.loading{
    display:block;
    background:rgba(246,196,83,.08);
    border:1px solid rgba(246,196,83,.2);
    color:#f6c453;
}

/* =========================
   HISTORY
========================= */

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.history-header h2{
    font-size:22px;
}

.refresh-btn{
    border:1px solid #343a45;
    background:#11151d;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.refresh-btn:hover{
    border-color:#f6c453;
    color:#f6c453;
}

.history-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
}

.history-item{
    overflow:hidden;
    background:#11151d;
    border:1px solid #242832;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(0,0,0,.2);
}

.history-media{
    width:100%;
    background:#05070a;
    aspect-ratio:16/10;
    overflow:hidden;
}

.history-media img,
.history-media video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.history-content{
    padding:18px;
}

.media-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(246,196,83,.1);
    border:1px solid rgba(246,196,83,.22);
    color:#f6c453;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:10px;
}

.history-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:7px;
}

.history-date{
    color:#858d9a;
    font-size:12px;
    margin-bottom:8px;
}

.history-uploader{
    display:inline-block;
    margin-bottom:12px;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(246,196,83,.07);
    border:1px solid rgba(246,196,83,.18);
    color:#f6c453;
    font-size:12px;
    font-weight:800;
}

.history-story{
    color:#aeb4be;
    font-size:13px;
    line-height:1.6;
    margin-bottom:15px;
    white-space:pre-wrap;
}

.delete-btn{
    width:100%;
    border:1px solid rgba(239,68,68,.3);
    background:rgba(239,68,68,.08);
    color:#fca5a5;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
    font-weight:800;
}

.delete-btn:hover{
    background:rgba(239,68,68,.14);
    border-color:#ef4444;
}

.loading-history,
.empty-history{
    grid-column:1/-1;
    text-align:center;
    padding:40px 20px;
    border:1px dashed #303641;
    border-radius:15px;
    color:#777f8c;
}

/* Supabase URL tidak ditampilkan sebagai teks */
.history-item a{
    display:none !important;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
    .history-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .topbar{
        padding:12px 15px;
    }

    .topbar-inner{
        align-items:flex-start;
    }

    .brand-sub{
        display:none;
    }

    .user-area{
        flex-direction:column;
        align-items:flex-end;
        gap:7px;
    }

    .container{
        padding:22px 14px 45px;
    }

    .panel{
        padding:18px;
        border-radius:16px;
    }

    .page-title h1{
        font-size:25px;
    }

    .history-header{
        align-items:flex-start;
    }

    .history-header h2{
        font-size:19px;
    }

    .refresh-btn{
        padding:8px 11px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<section id="loginPage">

    <div class="login-box">

        <div class="logo">
            <div class="logo-main">PRAN MUSIC</div>
            <div class="logo-sub">ADMIN KENANGAN</div>
        </div>

        <div class="login-title">
            Login Admin
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOGIN
            </button>

        </form>

        <div id="loginError" class="login-error"></div>

    </div>

</section>


<!-- =========================
     ADMIN PAGE
========================= -->

<section id="adminPage">

    <header class="topbar">

        <div class="topbar-inner">

            <div class="brand">
                <div>
                    <div class="brand-title">
                        PRAN MUSIC
                    </div>

                    <div class="brand-sub">
                        ADMIN KENANGAN
                    </div>
                </div>
            </div>

            <div class="user-area">

                <div
                    class="user-badge"
                    id="currentUserBadge"
                >
                    👤 -
                </div>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn"
                >
                    LOGOUT
                </button>

            </div>

        </div>

    </header>


    <main class="container">

        <div class="page-title">

            <h1>Upload Kenangan</h1>

            <p>
                Upload foto atau video dokumentasi PRAN MUSIC ENTAERTAIMENT.
            </p>

        </div>


        <!-- =========================
             UPLOAD PANEL
        ========================= -->

        <div class="panel">

            <div class="panel-title">
                Tambah Kenangan
            </div>


            <div class="media-type">

                <button
                    type="button"
                    id="photoTypeBtn"
                    class="active"
                >
                    📷 FOTO
                </button>

                <button
                    type="button"
                    id="videoTypeBtn"
                >
                    🎥 VIDEO
                </button>

            </div>


            <div class="file-box">

                <input
                    type="file"
                    id="mediaInput"
                    accept="image/*"
                    multiple
                >

                <div
                    id="selectedFiles"
                    class="selected-files"
                >
                    Belum ada file dipilih.
                </div>

            </div>


            <div class="form-group">

                <label>Judul</label>

                <input
                    type="text"
                    id="judul"
                    placeholder="Contoh: Dokumentasi Wedding"
                    required
                >

            </div>


            <div class="form-group">

                <label>Tanggal Acara</label>

                <input
                    type="date"
                    id="tanggal"
                >

            </div>


            <div class="form-group">

                <label>Cerita / Keterangan</label>

                <textarea
                    id="cerita"
                    placeholder="Tulis cerita atau keterangan kenangan..."
                ></textarea>

            </div>


            <div
                id="uploadStatus"
                class="status"
            ></div>


            <button
                type="button"
                class="post-btn"
                id="postBtn"
            >
                POST KENANGAN
            </button>

        </div>


        <!-- =========================
             HISTORY
        ========================= -->

        <div class="panel">

            <div class="history-header">

                <h2>
                    History Upload
                </h2>

                <button
                    type="button"
                    class="refresh-btn"
                    id="refreshBtn"
                >
                    ↻ REFRESH
                </button>

            </div>

            <div
                id="historyGrid"
                class="history-grid"
            ></div>

        </div>

    </main>

</section>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const currentUserBadge =
    document.getElementById("currentUserBadge");

const photoTypeBtn =
    document.getElementById("photoTypeBtn");

const videoTypeBtn =
    document.getElementById("videoTypeBtn");

const mediaInput =
    document.getElementById("mediaInput");

const selectedFiles =
    document.getElementById("selectedFiles");

const judulInput =
    document.getElementById("judul");

const tanggalInput =
    document.getElementById("tanggal");

const ceritaInput =
    document.getElementById("cerita");

const uploadStatus =
    document.getElementById("uploadStatus");

const postBtn =
    document.getElementById("postBtn");

const historyGrid =
    document.getElementById("historyGrid");

const refreshBtn =
    document.getElementById("refreshBtn");


/* =========================================================
   VARIABLES
========================================================= */

let selectedMedia = [];

let selectedMediaType = "foto";

let currentUsername = "";


/* =========================================================
   ALLOWED USERNAMES
   HANYA 2 AKUN
========================================================= */

const ALLOWED_USERNAMES = [
    "daligroup",
    "pranmusicentertaiment"
];


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener("submit", async function(event){

    event.preventDefault();

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    loginError.style.display = "none";
    loginError.textContent = "";

    if(!username || !password){
        showLoginError(
            "Username dan password wajib diisi."
        );
        return;
    }

    if(!ALLOWED_USERNAMES.includes(username)){
        showLoginError(
            "Username admin tidak terdaftar."
        );
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGIN...";

    try{

        /* Cari email berdasarkan username */

        const {
            data,
            error
        } = await supabaseClient
            .from("admin_login")
            .select("username, login_email")
            .eq("username", username)
            .maybeSingle();

        if(error){
            throw error;
        }

        if(!data){
            throw new Error(
                "Username tidak ditemukan."
            );
        }

        /* Login Supabase Auth */

        const {
            data: authData,
            error: authError
        } = await supabaseClient.auth.signInWithPassword({
            email: data.login_email,
            password: password
        });

        if(authError){
            throw authError;
        }

        if(!authData || !authData.user){
            throw new Error(
                "Login gagal."
            );
        }

        /* Cek admin */

        const {
            data: isAdmin,
            error: adminError
        } = await supabaseClient.rpc("is_admin");

        if(adminError){
            throw adminError;
        }

        if(!isAdmin){
            await supabaseClient.auth.signOut();

            throw new Error(
                "Akun ini bukan admin."
            );
        }

        /* Simpan username yang benar-benar login */

        currentUsername = data.username;

        currentUserBadge.textContent =
            "👤 " + currentUsername;

        showAdminPage();

        await loadHistory();

    }catch(error){

        console.error(error);

        showLoginError(
            "Login gagal: " + error.message
        );

    }finally{

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";

    }

});


/* =========================================================
   SHOW LOGIN ERROR
========================================================= */

function showLoginError(message){

    loginError.textContent = message;

    loginError.style.display = "block";

}


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdminPage(){

    loginPage.style.display = "none";

    adminPage.style.display = "block";

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async function(){

    await supabaseClient.auth.signOut();

    currentUsername = "";

    adminPage.style.display = "none";

    loginPage.style.display = "flex";

    usernameInput.value = "";
    passwordInput.value = "";

});


/* =========================================================
   CHECK SESSION
========================================================= */

async function checkSession(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if(error){
            throw error;
        }

        const session = data.session;

        if(!session){
            loginPage.style.display = "flex";
            adminPage.style.display = "none";
            return;
        }

        /* Cek admin */

        const {
            data: isAdmin,
            error: adminError
        } = await supabaseClient.rpc("is_admin");

        if(adminError || !isAdmin){

            await supabaseClient.auth.signOut();

            loginPage.style.display = "flex";
            adminPage.style.display = "none";

            return;
        }

        /*
         * Ambil username berdasarkan email
         * agar saat refresh browser username
         * tetap terbaca.
         */

        const {
            data: loginData,
            error: loginDataError
        } = await supabaseClient
            .from("admin_login")
            .select("username, login_email")
            .eq("login_email", session.user.email)
            .maybeSingle();

        if(loginDataError){
            throw loginDataError;
        }

        if(
            loginData &&
            ALLOWED_USERNAMES.includes(loginData.username)
        ){

            currentUsername =
                loginData.username;

        }else{

            await supabaseClient.auth.signOut();

            loginPage.style.display = "flex";
            adminPage.style.display = "none";

            return;
        }

        currentUserBadge.textContent =
            "👤 " + currentUsername;

        showAdminPage();

        await loadHistory();

    }catch(error){

        console.error(error);

        loginPage.style.display = "flex";
        adminPage.style.display = "none";

    }

}


/* =========================================================
   MEDIA TYPE
========================================================= */

photoTypeBtn.addEventListener("click", function(){

    selectedMediaType = "foto";

    photoTypeBtn.classList.add("active");

    videoTypeBtn.classList.remove("active");

    mediaInput.accept = "image/*";

    mediaInput.value = "";

    selectedMedia = [];

    updateSelectedFiles();

});


videoTypeBtn.addEventListener("click", function(){

    selectedMediaType = "video";

    videoTypeBtn.classList.add("active");

    photoTypeBtn.classList.remove("active");

    mediaInput.accept = "video/*";

    mediaInput.value = "";

    selectedMedia = [];

    updateSelectedFiles();

});


/* =========================================================
   SELECT MEDIA
========================================================= */

mediaInput.addEventListener("change", function(){

    selectedMedia =
        Array.from(mediaInput.files || []);

    updateSelectedFiles();

});


/* =========================================================
   DISPLAY SELECTED FILES
========================================================= */

function updateSelectedFiles(){

    if(selectedMedia.length === 0){

        selectedFiles.textContent =
            "Belum ada file dipilih.";

        return;
    }

    let html =
        "<strong>" +
        selectedMedia.length +
        " file dipilih:</strong><br>";

    selectedMedia.forEach(function(file, index){

        html +=
            (index + 1) +
            ". " +
            escapeHtml(file.name) +
            "<br>";

    });

    selectedFiles.innerHTML = html;

}


/* =========================================================
   UPLOAD
========================================================= */

postBtn.addEventListener("click", async function(){

    if(!currentUsername){

        showStatus(
            "error",
            "Akun uploader tidak terdeteksi. Silakan login kembali."
        );

        return;
    }

    if(
        !ALLOWED_USERNAMES.includes(
            currentUsername
        )
    ){

        showStatus(
            "error",
            "Akun uploader tidak valid."
        );

        return;
    }

    if(selectedMedia.length === 0){

        showStatus(
            "error",
            "Pilih foto atau video terlebih dahulu."
        );

        return;
    }

    const judul =
        judulInput.value.trim();

    const tanggal =
        tanggalInput.value;

    const cerita =
        ceritaInput.value.trim();

    if(!judul){

        showStatus(
            "error",
            "Judul wajib diisi."
        );

        return;
    }

    postBtn.disabled = true;

    showStatus(
        "loading",
        "Sedang mengupload media..."
    );

    try{

        for(
            let i = 0;
            i < selectedMedia.length;
            i++
        ){

            const file =
                selectedMedia[i];

            /*
             * Nama file unik
             */

            const extension =
                file.name.includes(".")
                ? file.name.split(".").pop()
                : "";

            const randomName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2,10);

            const filePath =
                randomName +
                (extension
                    ? "." + extension
                    : "");

            /*
             * Upload ke Storage
             */

            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("kenangan")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:file.type
                    }
                );

            if(uploadError){
                throw uploadError;
            }

            /*
             * Ambil URL publik
             */

            const {
                data: publicData
            } = supabaseClient
                .storage
                .from("kenangan")
                .getPublicUrl(filePath);

            const publicUrl =
                publicData.publicUrl;

            /*
             * Simpan metadata ke database
             *
             * uploader_username otomatis
             * mengambil akun yang login.
             */

            const {
                error: insertError
            } = await supabaseClient
                .from("kenangan")
                .insert({

                    judul: judul,

                    cerita: cerita,

                    tanggal:
                        tanggal || null,

                    foto_path:
                        filePath,

                    foto_url:
                        publicUrl,

                    media_type:
                        selectedMediaType,

                    uploader_username:
                        currentUsername

                });

            if(insertError){

                /*
                 * Kalau DB gagal,
                 * hapus file Storage agar
                 * tidak meninggalkan file sampah.
                 */

                await supabaseClient
                    .storage
                    .from("kenangan")
                    .remove([filePath]);

                throw insertError;
            }

        }


        showStatus(
            "success",
            "UPLOAD BERHASIL! Media disimpan sebagai upload oleh " +
            currentUsername + "."
        );


        /*
         * Reset form
         */

        selectedMedia = [];

        mediaInput.value = "";

        judulInput.value = "";

        tanggalInput.value = "";

        ceritaInput.value = "";

        updateSelectedFiles();


        /*
         * Refresh history
         */

        await loadHistory();


    }catch(error){

        console.error(error);

        showStatus(
            "error",
            "Upload gagal: " +
            error.message
        );

    }finally{

        postBtn.disabled = false;

    }

});


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory(){

    historyGrid.innerHTML = `
        <div class="loading-history">
            Memuat history...
        </div>
    `;

    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("kenangan")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

        if(error){
            throw error;
        }

        if(!data || data.length === 0){

            historyGrid.innerHTML = `
                <div class="empty-history">
                    Belum ada foto atau video yang diupload.
                </div>
            `;

            return;
        }

        historyGrid.innerHTML = "";


        data.forEach(function(item){

            const card =
                document.createElement("div");

            card.className =
                "history-item";


            /* =========================
               MEDIA
            ========================= */

            let media;


            if(item.media_type === "video"){

                const video =
                    document.createElement("video");

                video.src =
                    item.foto_url;

                video.controls =
                    true;

                video.preload =
                    "metadata";

                video.playsInline =
                    true;

                media = video;

            }else{

                const img =
                    document.createElement("img");

                img.src =
                    item.foto_url;

                img.alt =
                    item.judul ||
                    "Foto Kenangan";

                img.loading =
                    "lazy";

                media = img;

            }


            const mediaBox =
                document.createElement("div");

            mediaBox.className =
                "history-media";

            mediaBox.appendChild(media);


            /* =========================
               CONTENT
            ========================= */

            const content =
                document.createElement("div");

            content.className =
                "history-content";


            /* BADGE */

            const badge =
                document.createElement("div");

            badge.className =
                "media-badge";

            badge.textContent =
                item.media_type === "video"
                ? "VIDEO"
                : "FOTO";


            /* TITLE */

            const title =
                document.createElement("div");

            title.className =
                "history-title";

            title.textContent =
                item.judul ||
                "Tanpa Judul";


            /* DATE */

            const date =
                document.createElement("div");

            date.className =
                "history-date";

            date.textContent =
                item.tanggal
                ? formatDate(item.tanggal)
                : "Tanggal tidak diisi";


            /* =========================
               UPLOADER
            ========================= */

            const uploader =
                document.createElement("div");

            uploader.className =
                "history-uploader";

            uploader.textContent =
                "👤 Di-upload oleh: " +
                (
                    item.uploader_username ||
                    "Tidak diketahui"
                );


            /* STORY */

            const story =
                document.createElement("div");

            story.className =
                "history-story";

            story.textContent =
                item.cerita ||
                "Tidak ada keterangan.";


            /* DELETE */

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-btn";

            deleteButton.textContent =
                "🗑 HAPUS MEDIA";

            deleteButton.addEventListener(
                "click",
                function(){

                    deleteMemory(item.id);

                }
            );


            /* APPEND */

            content.appendChild(badge);

            content.appendChild(title);

            content.appendChild(date);

            content.appendChild(uploader);

            content.appendChild(story);

            content.appendChild(deleteButton);


            card.appendChild(mediaBox);

            card.appendChild(content);

            historyGrid.appendChild(card);

        });


    }catch(error){

        console.error(error);

        historyGrid.innerHTML = `
            <div class="empty-history">
                Gagal memuat history.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   DELETE MEMORY
========================================================= */

async function deleteMemory(id){

    const yakin =
        confirm(
            "Yakin ingin menghapus media ini?\n\n" +
            "File Storage dan data history akan dihapus."
        );

    if(!yakin){
        return;
    }

    try{

        /*
         * Ambil data terlebih dahulu
         */

        const {
            data,
            error
        } = await supabaseClient
            .from("kenangan")
            .select(
                "id, foto_path, media_type, judul, uploader_username"
            )
            .eq("id", id)
            .maybeSingle();

        if(error){
            throw error;
        }

        if(!data){
            throw new Error(
                "Data media tidak ditemukan."
            );
        }


        /*
         * Hapus file Storage
         */

        if(data.foto_path){

            const {
                error: storageError
            } = await supabaseClient
                .storage
                .from("kenangan")
                .remove([
                    data.foto_path
                ]);

            if(storageError){
                throw storageError;
            }

        }


        /*
         * Hapus data database
         */

        const {
            error: deleteError
        } = await supabaseClient
            .from("kenangan")
            .delete()
            .eq("id", id);

        if(deleteError){
            throw deleteError;
        }


        /*
         * Refresh
         */

        await loadHistory();

        showStatus(
            "success",
            "Media berhasil dihapus."
        );


    }catch(error){

        console.error(error);

        showStatus(
            "error",
            "Gagal menghapus media: " +
            error.message
        );

    }

}


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    async function(){

        await loadHistory();

    }
);


/* =========================================================
   STATUS
========================================================= */

function showStatus(type,message){

    uploadStatus.className =
        "status " + type;

    uploadStatus.textContent =
        message;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateString){

    try{

        const date =
            new Date(
                dateString +
                "T00:00:00"
            );

        return date.toLocaleDateString(
            "id-ID",
            {
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );

    }catch(error){

        return dateString;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

   START

checkSession();
