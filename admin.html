<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenangan | PRAN MUSIC ENTAERTAIMENT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080a0f;
    color:#fff;
    min-height:100vh;
}

header{
    padding:20px;
    border-bottom:1px solid rgba(246,196,83,.2);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#f6c453;
}

.logout{
    border:1px solid #f6c453;
    background:transparent;
    color:#f6c453;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.logout:hover{
    background:#f6c453;
    color:#080a0f;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#121722;
    border:1px solid rgba(246,196,83,.15);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#999;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#f6c453;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid rgba(246,196,83,.2);
    background:#080a0f;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#f6c453;
}

textarea{
    min-height:130px;
    resize:vertical;
}

select{
    cursor:pointer;
}

select option{
    background:#121722;
    color:#fff;
}

.upload-box{
    border:2px dashed rgba(246,196,83,.35);
    border-radius:15px;
    padding:25px;
    text-align:center;
    background:#0b0e15;
}

.upload-box:hover{
    border-color:#f6c453;
}

.upload-icon{
    font-size:42px;
    margin-bottom:10px;
}

.upload-text{
    color:#aaa;
    margin-bottom:15px;
}

.file-input{
    display:none;
}

.choose-btn{
    display:inline-block;
    padding:12px 20px;
    background:#f6c453;
    color:#080a0f;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.choose-btn:hover{
    background:#fff;
}

.file-info{
    margin-top:12px;
    color:#999;
    font-size:14px;
}

.preview-title{
    margin-top:25px;
    margin-bottom:12px;
    color:#f6c453;
    font-weight:bold;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:15px;
}

.preview-item{
    position:relative;
    background:#080a0f;
    border:1px solid rgba(246,196,83,.15);
    border-radius:12px;
    overflow:hidden;
}

.preview-item img,
.preview-item video{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    background:#000;
}

.preview-label{
    padding:8px;
    font-size:12px;
    color:#aaa;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.media-badge{
    position:absolute;
    top:8px;
    left:8px;
    padding:5px 8px;
    border-radius:6px;
    background:rgba(0,0,0,.75);
    color:#f6c453;
    font-size:11px;
    font-weight:bold;
}

.post-btn{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#f6c453;
    color:#080a0f;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.post-btn:hover{
    background:#fff;
}

.post-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    display:none;
    line-height:1.5;
}

.status.success{
    display:block;
    background:rgba(40,180,100,.12);
    border:1px solid rgba(40,180,100,.4);
    color:#72e6a1;
}

.status.error{
    display:block;
    background:rgba(255,70,70,.12);
    border:1px solid rgba(255,70,70,.4);
    color:#ff8d8d;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:30px;
}

#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#121722;
    border:1px solid rgba(246,196,83,.15);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.login-logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:10px;
}

.login-logo span{
    color:#f6c453;
}

.login-subtitle{
    text-align:center;
    color:#888;
    margin-bottom:25px;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#f6c453;
    color:#080a0f;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.login-btn:hover{
    background:#fff;
}

#adminPanel{
    display:none;
}

@media(max-width:600px){

    header{
        padding:15px;
    }

    .logo{
        font-size:16px;
    }

    .logout{
        padding:8px 12px;
        font-size:12px;
    }

    .container{
        margin:20px auto;
        padding:12px;
    }

    .card{
        padding:20px;
    }

    h1{
        font-size:24px;
    }

    .preview-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .preview-item img,
    .preview-item video{
        height:120px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

    <div class="login-card">

        <div class="login-logo">
            PRAN <span>MUSIC</span>
        </div>

        <div class="login-subtitle">
            ADMIN KENANGAN
        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email admin"
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

        </div>

        <button
            class="login-btn"
            id="loginBtn"
        >
            LOGIN ADMIN
        </button>

        <div
            id="loginStatus"
            class="status"
        ></div>

    </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">

<header>

    <div class="logo">
        PRAN <span>MUSIC</span> ENTAERTAIMENT
    </div>

    <button
        class="logout"
        id="logoutBtn"
    >
        LOGOUT
    </button>

</header>


<div class="container">

<div class="card">

    <h1>
        Tambah Kenangan
    </h1>

    <div class="subtitle">
        Upload foto atau video untuk ditampilkan di halaman kenangan.
    </div>


    <!-- JENIS MEDIA -->

    <div class="form-group">

        <label>
            Jenis Media
        </label>

        <select id="mediaType">

            <option value="foto">
                📸 Foto
            </option>

            <option value="video">
                🎥 Video
            </option>

        </select>

    </div>


    <!-- JUDUL -->

    <div class="form-group">

        <label>
            Judul
        </label>

        <input
            type="text"
            id="judul"
            placeholder="Contoh: Acara Wedding 2026"
        >

    </div>


    <!-- TANGGAL -->

    <div class="form-group">

        <label>
            Tanggal
        </label>

        <input
            type="date"
            id="tanggal"
        >

    </div>


    <!-- CERITA -->

    <div class="form-group">

        <label>
            Cerita
        </label>

        <textarea
            id="cerita"
            placeholder="Tulis cerita atau keterangan kenangan..."
        ></textarea>

    </div>


    <!-- UPLOAD -->

    <div class="form-group">

        <label>
            Upload Media
        </label>

        <div class="upload-box">

            <div class="upload-icon" id="uploadIcon">
                📸
            </div>

            <div
                class="upload-text"
                id="uploadText"
            >
                Pilih satu atau beberapa foto
            </div>

            <label
                for="mediaInput"
                class="choose-btn"
            >
                PILIH FILE
            </label>

            <input
                type="file"
                id="mediaInput"
                class="file-input"
                accept="image/*"
                multiple
            >

            <div
                class="file-info"
                id="fileInfo"
            >
                Belum ada file dipilih
            </div>

        </div>

    </div>


    <!-- PREVIEW -->

    <div
        id="previewTitle"
        class="preview-title"
        style="display:none;"
    >
        Preview Media
    </div>

    <div
        id="previewGrid"
        class="preview-grid"
    ></div>


    <!-- POST -->

    <button
        class="post-btn"
        id="postBtn"
    >
        POST KENANGAN
    </button>


    <div
        id="status"
        class="status"
    ></div>

</div>

</div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const loginScreen =
    document.getElementById("loginScreen");

const adminPanel =
    document.getElementById("adminPanel");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginStatus =
    document.getElementById("loginStatus");

const statusBox =
    document.getElementById("status");

const mediaType =
    document.getElementById("mediaType");

const mediaInput =
    document.getElementById("mediaInput");

const previewGrid =
    document.getElementById("previewGrid");

const previewTitle =
    document.getElementById("previewTitle");

const fileInfo =
    document.getElementById("fileInfo");

const uploadIcon =
    document.getElementById("uploadIcon");

const uploadText =
    document.getElementById("uploadText");

const postBtn =
    document.getElementById("postBtn");

let selectedMedia = [];


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type,
    target = statusBox
){

    target.className =
        "status " + type;

    target.textContent =
        message;

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();

    if(
        error ||
        !data.session
    ){

        loginScreen.style.display =
            "flex";

        adminPanel.style.display =
            "none";

        return;

    }

    const {
        data:adminData,
        error:adminError
    } =
    await supabaseClient
        .rpc("is_admin");

    if(
        adminError ||
        !adminData
    ){

        await supabaseClient
            .auth
            .signOut();

        loginScreen.style.display =
            "flex";

        adminPanel.style.display =
            "none";

        showStatus(
            "Akun ini bukan admin.",
            "error",
            loginStatus
        );

        return;

    }

    loginScreen.style.display =
        "none";

    adminPanel.style.display =
        "block";

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value;

        if(
            !email ||
            !password
        ){

            showStatus(
                "Email dan password wajib diisi.",
                "error",
                loginStatus
            );

            return;

        }

        loginBtn.disabled = true;

        loginBtn.textContent =
            "LOGIN...";

        try{

            const {
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });

            if(error){

                throw error;

            }

            await checkSession();

        }
        catch(error){

            console.error(error);

            showStatus(
                "Login gagal: " +
                error.message,
                "error",
                loginStatus
            );

        }
        finally{

            loginBtn.disabled = false;

            loginBtn.textContent =
                "LOGIN ADMIN";

        }

    }
);


/* =========================
   ENTER LOGIN
========================= */

document
.getElementById("loginPassword")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            loginBtn.click();

        }

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient
            .auth
            .signOut();

        location.reload();

    }
);


/* =========================
   MEDIA TYPE
========================= */

mediaType.addEventListener(
    "change",
    function(){

        selectedMedia = [];

        mediaInput.value = "";

        previewGrid.innerHTML = "";

        previewTitle.style.display =
            "none";

        fileInfo.textContent =
            "Belum ada file dipilih";

        if(
            mediaType.value === "video"
        ){

            uploadIcon.textContent =
                "🎥";

            uploadText.textContent =
                "Pilih satu atau beberapa video";

            mediaInput.accept =
                "video/*";

        }
        else{

            uploadIcon.textContent =
                "📸";

            uploadText.textContent =
                "Pilih satu atau beberapa foto";

            mediaInput.accept =
                "image/*";

        }

    }
);


/* =========================
   SELECT FILE
========================= */

mediaInput.addEventListener(
    "change",
    function(){

        selectedMedia =
            Array.from(
                mediaInput.files
            );

        previewGrid.innerHTML = "";

        if(
            selectedMedia.length === 0
        ){

            previewTitle.style.display =
                "none";

            fileInfo.textContent =
                "Belum ada file dipilih";

            return;

        }

        previewTitle.style.display =
            "block";

        fileInfo.textContent =
            selectedMedia.length +
            " file dipilih";

        selectedMedia.forEach(
            function(file){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "preview-item";


                const badge =
                    document.createElement(
                        "div"
                    );

                badge.className =
                    "media-badge";

                badge.textContent =
                    mediaType.value === "video"
                    ? "VIDEO"
                    : "FOTO";


                if(
                    mediaType.value === "video"
                ){

                    const video =
                        document.createElement(
                            "video"
                        );

                    video.src =
                        URL.createObjectURL(
                            file
                        );

                    video.controls =
                        true;

                    video.preload =
                        "metadata";

                    item.appendChild(
                        video
                    );

                }
                else{

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        URL.createObjectURL(
                            file
                        );

                    item.appendChild(
                        img
                    );

                }


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "preview-label";

                name.textContent =
                    file.name;


                item.appendChild(
                    badge
                );

                item.appendChild(
                    name
                );

                previewGrid.appendChild(
                    item
                );

            }
        );

    }
);


/* =========================
   POST KENANGAN
========================= */

postBtn.addEventListener(
    "click",
    async function(){

        const judul =
            document
            .getElementById("judul")
            .value
            .trim();

        const tanggal =
            document
            .getElementById("tanggal")
            .value;

        const cerita =
            document
            .getElementById("cerita")
            .value
            .trim();

        if(!judul){

            showStatus(
                "Judul wajib diisi.",
                "error"
            );

            return;

        }

        if(
            selectedMedia.length === 0
        ){

            showStatus(
                "Pilih foto atau video terlebih dahulu.",
                "error"
            );

            return;

        }


        postBtn.disabled =
            true;

        postBtn.textContent =
            "MENGUPLOAD...";


        try{

            for(
                let i = 0;
                i < selectedMedia.length;
                i++
            ){

                const file =
                    selectedMedia[i];


                /* =========================
                   SAFE FILE NAME
                ========================= */

                const cleanName =
                    file.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "-"
                    );


                const filePath =
                    Date.now() +
                    "-" +
                    Math.random()
                    .toString(36)
                    .substring(2,10) +
                    "-" +
                    cleanName;


                /* =========================
                   UPLOAD STORAGE
                ========================= */

                const {
                    error:uploadError
                } =
                await supabaseClient
                    .storage
                    .from("kenangan")
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false,
                            contentType:file.type
                        }
                    );


                if(uploadError){

                    throw uploadError;

                }


                /* =========================
                   PUBLIC URL
                ========================= */

                const {
                    data:publicData
                } =
                supabaseClient
                    .storage
                    .from("kenangan")
                    .getPublicUrl(
                        filePath
                    );


                const mediaUrl =
                    publicData.publicUrl;


                /* =========================
                   DATABASE
                ========================= */

                const {
                    error:databaseError
                } =
                await supabaseClient
                    .from("kenangan")
                    .insert({

                        judul:judul,

                        cerita:cerita,

                        tanggal:
                            tanggal || null,

                        foto_path:
                            filePath,

                        foto_url:
                            mediaUrl,

                        media_type:
                            mediaType.value

                    });


                if(databaseError){

                    throw databaseError;

                }

            }


            /* =========================
               SUCCESS
            ========================= */

            showStatus(
                "✓ " +
                selectedMedia.length +
                " MEDIA BERHASIL DIPOSTING!",
                "success"
            );


            mediaInput.value =
                "";

            selectedMedia =
                [];

            previewGrid.innerHTML =
                "";

            previewTitle.style.display =
                "none";

            fileInfo.textContent =
                "Belum ada file dipilih";

            document
                .getElementById("judul")
                .value =
                "";

            document
                .getElementById("tanggal")
                .value =
                "";

            document
                .getElementById("cerita")
                .value =
                "";


        }
        catch(error){

            console.error(error);

            showStatus(
                "Gagal upload: " +
                error.message,
                "error"
            );

        }
        finally{

            postBtn.disabled =
                false;

            postBtn.textContent =
                "POST KENANGAN";

        }

    }
);


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
